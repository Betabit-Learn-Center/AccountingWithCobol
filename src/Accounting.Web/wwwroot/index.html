<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontoverwaltung</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    #balance { font-size: 2rem; font-weight: bold; }
    form { margin: 1rem 0; display: flex; gap: .5rem; align-items: center; }
    input { flex: 1; padding: .4rem; }
    #message { min-height: 1.5rem; }
    #message.error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Kontoverwaltung</h1>
  <p>Aktueller Saldo: <span id="balance">…</span></p>

  <form id="credit-form">
    <input id="credit-amount" inputmode="decimal" autocomplete="off" placeholder="Betrag, z. B. 200.00" aria-label="Gutschrift">
    <button type="submit">Gutschrift</button>
  </form>
  <form id="debit-form">
    <input id="debit-amount" inputmode="decimal" autocomplete="off" placeholder="Betrag, z. B. 300.00" aria-label="Abbuchung">
    <button type="submit">Abbuchung</button>
  </form>

  <p id="message" role="status"></p>
  <script src="app.js"></script>
</body>
</html>
